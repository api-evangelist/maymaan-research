aid: maymaan-research
name: MayMaan Research
description: >-
  MayMaan Research is a clean-energy engineering company that redesigns the internal
  combustion engine around its patented AquaStroke platform, a piston engine that runs
  on a blend of roughly 70% water and 30% bio-alcohol (ethanol or methanol) instead of
  gasoline or diesel. The company builds modular generator sets and powertrains that
  scale from a 35 kW unit (A35) through the AV2 to multi-megawatt installations, and it
  positions them as drop-in replacements for diesel gensets in power generation, EV
  charging infrastructure, data centers, telecommunications, marine, construction,
  agriculture, defense and off-grid deployments, with near-zero NOx, SOx, CO2 and
  particulate output. MayMaan is headquartered in Hollywood, Florida with a European
  office in Paris, holds engine and fuel-system patents internationally, and raised a
  $30 million Series A led by WAVE Equity Partners. It is a hardware manufacturer: as of
  this profile it publishes no public API, developer portal, SDK or machine-readable
  interface of any kind.
